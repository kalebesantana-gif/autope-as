<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Rota 7 Autopeças</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="mark">ROTA 7</span><span class="tag">autopeças &amp; acessórios</span></div>
    <div class="nav" id="nav-slot"></div>
  </div>

  <div class="container">
    <h1>Criar conta</h1>
    <div id="flash" class="flash erro hidden"></div>
    <form class="painel" id="form-registro">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required>
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" required>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>
      <button class="btn" type="submit" style="margin-top:1.2rem;">Criar conta</button>
    </form>
  </div>

  <footer>Rota 7 Autopeças — sistema estático desenvolvido para fins educacionais.</footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    montarNav();
    document.getElementById("form-registro").addEventListener("submit", aoSubmeterRegistro);
  </script>
</body>
</html>
