<!DOCTYPE html>
<html lang="pt-br">
<head>

  <div class="container">

    <h2 style="margin-top:1.5rem;">Deixe sua avaliação</h2>

      <button class="btn" type="submit" style="margin-top:1rem;">Publicar avaliação</button>
